[package]
name = "app"
version = "1.0.1"
description = "RepoLens - read-only Git repository viewer"
authors = ["RepoLens Contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
dirs = "7"
dunce = "1"
notify = "8"
rfd = "0.15"

[dev-dependencies]
tempfile = "3"
