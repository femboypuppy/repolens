name: Package Application

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag or version label (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

jobs:
  package-desktop:
    name: Package Desktop (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS-Apple-Silicon
            os: macos-latest
            artifact-path: src-tauri/target/release/bundle/dmg/*.dmg
          - name: macOS-Intel
            os: macos-13
            artifact-path: src-tauri/target/release/bundle/dmg/*.dmg
          - name: Windows-x64
            os: windows-latest
            artifact-path: src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux-x64
            os: ubuntu-22.04
            artifact-path: src-tauri/target/release/bundle/appimage/*.AppImage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build desktop bundle
        run: npm run build:tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload packaging artifacts
        uses: actions/upload-artifact@v4
        with:
          name: repolens-${{ matrix.platform.name }}
          path: |
            src-tauri/target/release/bundle/
          if-no-files-found: warn
